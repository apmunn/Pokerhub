name: PokerHub Checks
on:
  push:
  pull_request:
jobs:
  poker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run engine and multiplayer tests
        run: npm test
