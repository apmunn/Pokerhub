const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[['home','⌂','Home'],['play','♠','Play'],['lessons','▣','Lessons'],['analyzer','◇','Analyzer'],['coach','✦','Coach'],['ranked','★','Rankings'],['tournaments','♜','Tournaments'],['social','♧','Community'],['profile','◉','Profile']];
const KEY='pokerhub-local-v1',base={name:'Player',chips:2000,xp:0,completed:[],wins:0,played:0,hands:[],achievements:[],sound:false};
let state;try{state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...base}};
let page='home',game=null,lessonIndex=0,lessonStep=0,lessonAnswered=false,lessonChoice=-1,analysisCards=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2700)}
function level(){return 1+Math.floor(state.xp/150)}function rank(){return state.xp>=1800?'Master':state.xp>=1000?'Diamond':state.xp>=550?'Gold':state.xp>=200?'Silver':'Rookie'}
function addXP(n){state.xp+=n;save();toast('+'+n+' XP earned!')}function award(id){if(!state.achievements.includes(id)){state.achievements.push(id);toast('Achievement unlocked: '+id);save()}}
function nav(){ $('#nav').innerHTML=NAV.map(n=>'<button class="'+(page===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')" title="'+n[2]+'"><span>'+n[1]+'</span> <span class="navtext">'+n[2]+'</span></button>').join('');$('#balance').textContent='◈ '+state.chips.toLocaleString()+' chips'}

function home(){return '<section class="hero"><div class="eyebrow">WELCOME BACK, '+esc(state.name).toUpperCase()+'</div><h1>Every hand is a chance<br>to get better.</h1><p>Play practice Texas Hold’em, learn by making real decisions, and build your skills one hand at a time.</p><div class="actions"><button class="btn" onclick="go(\'play\')">♠ Play a hand →</button><button class="btn alt" onclick="go(\'lessons\')">Explore lessons</button></div></section><div class="grid"><div class="panel"><div class="muted">Your rank</div><div class="stat">'+rank()+'</div><div class="muted tiny">Level '+level()+'</div></div><div class="panel"><div class="muted">Learning XP</div><div class="stat">'+state.xp+'</div><div class="bar"><div style="width:'+((state.xp%150)/1.5)+'%"></div></div></div><div class="panel"><div class="muted">Practice wins</div><div class="stat">'+state.wins+' / '+state.played+'</div><div class="muted tiny">Hands completed</div></div></div><div class="split" style="margin-top:15px">'+panel('Continue learning','<p class="muted">'+state.completed.length+' of '+LESSONS.length+' lessons completed. Learn hand rankings, decisions, odds, and more.</p><button class="btn" onclick="go(\'lessons\')">Open academy →</button>')+panel('Your milestones','<p>🏅 '+state.achievements.length+' achievements earned</p><p class="muted">Complete your first lesson and win a practice hand to unlock badges.</p>')+'</div>'}
const suits=['♠','♥','♦','♣'],ranks='23456789TJQKA'.split(''),deckAll=ranks.flatMap(r=>suits.map(s=>r+s));
function shuffled(){let a=deckAll.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function displayCard(c){if(!c)return '<span class="playing back">?</span>';let r=c[0]==='T'?'10':c[0],s=c[1];return '<span class="playing '+('♥♦'.includes(s)?'red':'')+'" aria-label="'+r+s+'"><span>'+r+'</span><span class="suit">'+s+'</span></span>'}
function cards(a){return '<div class="cardrow">'+a.map(displayCard).join('')+'</div>'}
function score5(a){let ns=a.map(c=>ranks.indexOf(c[0])+2).sort((x,y)=>y-x),counts={};ns.forEach(n=>counts[n]=(counts[n]||0)+1);let flush=a.every(c=>c[1]===a[0][1]),unique=[...new Set(ns)],straight=0;if(unique.includes(14))unique.push(1);for(let i=0;i<=unique.length-5;i++){if(unique[i]-unique[i+4]===4){straight=unique[i];break}}let groups=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]||b-a),freq=groups.map(n=>counts[n]);let vals,cat;if(flush&&straight){cat=8;vals=[straight]}else if(freq[0]===4){cat=7;vals=[groups[0],groups[1]]}else if(freq[0]===3&&freq[1]===2){cat=6;vals=groups.slice(0,2)}else if(flush){cat=5;vals=ns}else if(straight){cat=4;vals=[straight]}else if(freq[0]===3){cat=3;vals=groups}else if(freq[0]===2&&freq[1]===2){cat=2;vals=groups}else if(freq[0]===2){cat=1;vals=groups}else{cat=0;vals=ns}return [cat,...vals,...Array(5).fill(0)].slice(0,6)}
const names=['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
function compare(a,b){for(let i=0;i<6;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0}
function evaluate(a){if(a.length<5)return null;let best=null;for(let i=0;i<a.length-4;i++)for(let j=i+1;j<a.length-3;j++)for(let k=j+1;k<a.length-2;k++)for(let l=k+1;l<a.length-1;l++)for(let m=l+1;m<a.length;m++){let v=score5([a[i],a[j],a[k],a[l],a[m]]);if(!best||compare(v,best)>0)best=v}return best}
function newGame(){if(state.chips<50){state.chips+=500;save();toast('Added 500 free practice chips')}let d=shuffled(),ante=20;game={deck:d,hero:d.splice(0,2),bot:d.splice(0,2),board:[],street:0,pot:ante*2,heroStack:Math.min(500,state.chips)-ante,botStack:500-ante,heroBet:0,botBet:0,active:true,done:false,log:['Both players posted 20 chips.'],message:'Your move. You act first.',lastAction:'',result:null};state.chips-=ante;save();render()}
function log(msg){game.log.unshift(msg)}
function botTurn(){if(!game||game.done)return;let g=game,need=Math.max(0,g.heroBet-g.botBet);let strength=evaluate([...g.bot,...g.board]);let likely=(strength?strength[0]*.1:Math.max(...g.bot.map(c=>ranks.indexOf(c[0])))/16)+Math.random()*.32;if(need>0&&likely<.27&&need>45){log('Computer folds.');finish('foldbot');return}let amount=Math.min(need,g.botStack);g.botStack-=amount;g.botBet+=amount;if(need>0)log('Computer calls '+amount+'.');else log('Computer checks.');nextStreet()}
function move(action){let g=game;if(!g||g.done)return;let need=Math.max(0,g.botBet-g.heroBet);if(action==='fold'){log('You fold.');finish('foldhero');return}let amount=0;if(action==='call'){amount=Math.min(need,g.heroStack);log(need?'You call '+amount+'.':'You check.')}if(action==='raise'){let desired=Number($('#betAmount').value);if(!Number.isFinite(desired)||desired<20){toast('Minimum bet or raise is 20 chips.');return}amount=Math.min(g.heroStack,need+Math.floor(desired));if(amount<=need&&g.heroStack>need){toast('Raise must exceed the call.');return}log('You bet '+amount+' chips.')}if(action==='allin'){amount=g.heroStack;log('You move all-in for '+amount+'.')}g.heroStack-=amount;g.heroBet+=amount;if(g.heroBet>g.botBet&&g.botStack===0){nextStreet();return}botTurn();render()}
function nextStreet(){let g=game;if(g.done)return;let matched=Math.min(g.heroBet,g.botBet);if(g.heroBet!==g.botBet){let over=Math.abs(g.heroBet-g.botBet);if(g.heroBet>g.botBet){g.heroStack+=over;g.heroBet-=over}else{g.botStack+=over;g.botBet-=over}log('Uncalled '+over+' chips returned.')}g.pot+=g.heroBet+g.botBet;g.heroBet=0;g.botBet=0;if(g.street===3){finish('showdown');return}g.street++;let n=g.street===1?3:1;g.board.push(...g.deck.splice(0,n));log(['','Flop','Turn','River'][g.street]+' dealt.');if(g.heroStack===0||g.botStack===0){while(g.street<3){g.street++;g.board.push(...g.deck.splice(0,g.street===1?3:1))}finish('showdown')}}
function finish(kind){let g=game;if(!g||g.done)return;g.done=true;g.active=false;let cmp=kind==='foldhero'?-1:kind==='foldbot'?1:compare(evaluate([...g.hero,...g.board]),evaluate([...g.bot,...g.board]));let result=cmp>0?'win':cmp<0?'loss':'tie';if(cmp>0){g.heroStack+=g.pot;log('You win '+g.pot+' chips!');state.wins++;award('First Win')}else if(cmp<0){g.botStack+=g.pot;log('Computer wins the pot.')}else{let half=Math.floor(g.pot/2);g.heroStack+=half;g.botStack+=g.pot-half;log('Split pot.')}state.chips+=g.heroStack;state.played++;state.hands.unshift({date:new Date().toLocaleDateString(),result:result,hero:g.hero.slice(),bot:g.bot.slice(),board:g.board.slice(),pot:g.pot});state.hands=state.hands.slice(0,25);addXP(10);award('First Hand');save();g.result=result;g.message=cmp>0?'You won the hand!':cmp<0?'Computer wins this hand.':'It’s a tie!'}
function play(){let g=game;if(!g)return '<div class="hero"><div class="eyebrow">SOLO PRACTICE</div><h1>Your seat is ready.</h1><p>Play a simplified heads-up Texas Hold’em practice game against a computer opponent. No real players or money involved.</p><button class="btn" onclick="newGame()">Deal a hand →</button></div>'+panel('Practice rules','<p class="muted">Both players begin with 500 practice chips (or your available balance). Each posts 20 chips. Practice checking, calling, betting and folding through flop, turn and river. The computer follows a basic simplified strategy. This mode is for learning, not competitive or casino-grade play.</p>');let need=Math.max(0,g.botBet-g.heroBet);return '<div class="row"><div><div class="eyebrow">PRACTICE TABLE</div><h1>Heads-up Hold’em</h1></div><span class="badge">'+(g.done?'Hand complete':['Preflop','Flop','Turn','River'][g.street])+'</span></div><div class="split"><div class="panel"><div class="felt"><div class="seat">🤖 Computer · '+g.botStack+' chips<div class="cards">'+(g.done?g.bot.map(displayCard).join(''):'<span class="playing back"></span><span class="playing back"></span>')+'</div></div><div class="middle"><div class="pot">POT · '+(g.pot+g.heroBet+g.botBet)+' CHIPS</div>'+cards(g.board)+'</div><div class="seat '+(!g.done?'turn':'')+'">◉ '+esc(state.name)+' · '+g.heroStack+' chips<div class="cards">'+g.hero.map(displayCard).join('')+'</div></div></div><div class="notice">'+esc(g.message)+'</div><div class="controls" style="margin-top:14px">'+(g.done?'<button class="btn" onclick="newGame()">Next hand →</button>':'<button class="btn danger" onclick="move(\'fold\')">Fold</button><button class="btn alt" onclick="move(\'call\')">'+(need?'Call '+need:'Check')+'</button><input id="betAmount" type="number" min="20" step="10" value="40" aria-label="Bet amount"><button class="btn" onclick="move(\'raise\')">Bet / Raise</button><button class="btn gold" onclick="move(\'allin\')">All-in</button>')+'</div><p class="muted tiny">Bet size is the amount added above any call. Uncalled chips are returned.</p></div>'+panel('Hand timeline','<div class="log" aria-live="polite">'+g.log.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div>')+'</div>'}
const LESSONS=[

{title:'Tournament Decisions',category:'Strategy',desc:'Adapt to changing stacks.',q:'Why do stack sizes matter in tournaments?',choices:['They affect available actions and risk','They change card ranks','They eliminate blinds'],answer:0,why:'Your stack relative to blinds and opponents influences your strategic options.'}

function lessons(){let current=LESSONS[lessonIndex];return '<div class="eyebrow">POKER ACADEMY</div><h1>Learn by playing.</h1><p class="muted">Choose answers, get explanations, earn XP and unlock progress.</p><div class="split"><div class="stack">'+panel('Learning paths','<div class="stack">'+LESSONS.map((l,i)=>'<button class="lessonitem" onclick="openLesson('+i+')" style="text-align:left;color:inherit"><div class="row"><strong>'+(i+1)+'. '+esc(l.title)+'</strong><span class="badge">'+(state.completed.includes(i)?'✓ Done':esc(l.category))+'</span></div><div class="muted tiny">'+esc(l.desc)+'</div></button>').join('')+'</div>')+'</div><div>'+panel('Interactive lesson','<div class="lesson"><div class="progressline">Lesson '+(lessonIndex+1)+' of '+LESSONS.length+'</div><div class="eyebrow">'+esc(current.category)+'</div><h2>'+esc(current.title)+'</h2><strong>'+esc(current.q)+'</strong>'+current.choices.map((c,i)=>'<button class="answer '+(lessonAnswered?(i===current.answer?'correct':i===lessonChoice?'wrong':''):'')+'" onclick="answerLesson('+i+')" '+(lessonAnswered?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('')+(lessonAnswered?'<div class="notice '+(lessonChoice===current.answer?'':'error')+'"><strong>'+(lessonChoice===current.answer?'Correct!':'Not quite.')+'</strong><p>'+esc(current.why)+'</p></div><button class="btn" onclick="nextLesson()">'+(lessonIndex===LESSONS.length-1?'Back to first lesson':'Next lesson →')+'</button>':'<p class="muted tiny">Choose an answer to get instant feedback.</p>')+'</div>')+'</div></div>'}
function openLesson(i){lessonIndex=i;lessonAnswered=false;lessonChoice=-1;render()}function answerLesson(i){if(lessonAnswered)return;lessonChoice=i;lessonAnswered=true;if(i===LESSONS[lessonIndex].answer){if(!state.completed.includes(lessonIndex)){state.completed.push(lessonIndex);addXP(50);if(state.completed.length===1)award('First Lesson');if(state.completed.length===LESSONS.length)award('Academy Graduate');save()}}render()}function nextLesson(){openLesson((lessonIndex+1)%LESSONS.length)}
function analyzer(){let best=evaluate(analysisCards);return '<div class="eyebrow">HAND LAB</div><h1>Hand Analyzer</h1><p class="muted">Select 5 to 7 distinct cards to identify the strongest five-card poker hand.</p><div class="split">'+panel('Selected cards','<div class="cardrow" style="min-height:85px">'+(analysisCards.length?analysisCards.map(displayCard).join(''):'<span class="muted">No cards selected yet</span>')+'</div><div class="actions"><button class="btn alt small" onclick="analysisCards=[];render()">Clear cards</button><button class="btn alt small" onclick="analysisCards.pop();render()">Undo</button></div><div class="notice" style="margin-top:15px">'+(best?'Best hand: <strong>'+names[best[0]]+'</strong>':analysisCards.length+' / 5 minimum cards selected')+'</div>')+panel('Card picker','<div class="stack">'+suits.map(s=>'<div class="row" style="justify-content:flex-start;gap:4px">'+ranks.map(r=>'<button class="btn small '+(analysisCards.includes(r+s)?'gold':'alt')+'" style="padding:6px;min-width:33px" onclick="pickCard(\''+r+s+'\')">'+(r==='T'?'10':r)+s+'</button>').join('')+'</div>').join('')+'</div><p class="muted tiny">Cards cannot be selected twice. Maximum seven cards.</p>')+'</div>'}
function pickCard(c){if(analysisCards.includes(c)){analysisCards=analysisCards.filter(x=>x!==c)}else if(analysisCards.length<7){analysisCards.push(c)}else{toast('Maximum seven cards');return}render()}
const coaching=[['What are pot odds?','Pot odds compare the cost of calling to the final pot. Divide the call amount by the pot after your call to estimate the equity needed.'],['When should I fold?','Consider your hand strength, position, bet size, pot odds, and the opponent’s likely range. Folding is often the right decision.'],['What is position?','Position is your place in the betting order. Acting later lets you observe opponents before deciding.'],['What is a value bet?','A value bet is made when you expect weaker hands to call often enough to make betting worthwhile.'],['How do I improve?','Complete interactive lessons, review your hands, practice hand rankings, and focus on making sound decisions rather than just winning pots.']];
let coachSelected=0;
function coach(){return '<div class="eyebrow">LEARNING ASSISTANT</div><h1>Strategy Coach</h1><p class="muted">Built-in educational explanations. This is not a connected AI chat service.</p><div class="split">'+panel('Ask a topic','<div class="stack">'+coaching.map((q,i)=>'<button class="answer" onclick="coachSelected='+i+';render()">'+esc(q[0])+'</button>').join('')+'</div>')+panel('Coach explains','<div class="eyebrow">TOPIC '+(coachSelected+1)+'</div><h2>'+esc(coaching[coachSelected][0])+'</h2><p>'+esc(coaching[coachSelected][1])+'</p><button class="btn alt" onclick="go(\'lessons\')">Practice with lessons →</button>')+'</div>'}
function ranked(){return '<div class="eyebrow">YOUR PROGRESSION</div><h1>Rankings</h1><div class="grid">'+panel('Your tier','<div class="stat">'+rank()+'</div><p class="muted">Based on learning XP in this local practice edition.</p>')+panel('Total XP','<div class="stat">'+state.xp+'</div>')+panel('Practice wins','<div class="stat">'+state.wins+'</div>')+'</div>'+panel('About online ranked play','<p class="muted">Online matchmaking and global leaderboards require verified multiplayer game results, accounts, and a server. They are not active in this local edition. Keep practicing to build your XP rank.</p>')}
function tournaments(){return '<div class="eyebrow">EVENT CENTER</div><h1>Tournaments</h1>'+panel('Coming with multiplayer infrastructure','<p class="muted">Live tournaments require synchronized tables, registered players, timers, standings, and server-validated results. They are not running yet. In the meantime, practice against the computer and finish Academy challenges.</p><button class="btn" onclick="go(\'play\')">Play practice poker →</button>')}
function social(){return '<div class="eyebrow">COMMUNITY</div><h1>Friends & Clubs</h1>'+panel('Community features are in development','<p class="muted">Friend requests, clubs, invitations and real-time multiplayer need member accounts and a backend. This local edition does not invent online players or fake messages.</p><button class="btn" onclick="go(\'lessons\')">Explore the Academy →</button>')}
function profile(){return '<div class="eyebrow">PLAYER PROFILE</div><h1>Your profile</h1><div class="split">'+panel('Personalize','<label class="field">Display name<input id="username" maxlength="24" value="'+esc(state.name)+'"></label><button class="btn" onclick="setName()">Save name</button><div class="actions"><button class="btn alt small" onclick="exportData()">Export progress</button><button class="btn danger small" onclick="resetData()">Reset local progress</button></div><p class="muted tiny">Data is stored in this browser only. Clearing browser data may remove it.</p>')+panel('Stats & achievements','<p><strong>Rank:</strong> '+rank()+'</p><p><strong>Level:</strong> '+level()+'</p><p><strong>XP:</strong> '+state.xp+'</p><p><strong>Lessons:</strong> '+state.completed.length+' / '+LESSONS.length+'</p><p><strong>Hands:</strong> '+state.played+'</p><p><strong>Badges:</strong> '+(state.achievements.length?state.achievements.map(esc).join(', '):'None yet')+'</p>')+'</div>'+panel('Recent practice hands',state.hands.length?'<div class="stack">'+state.hands.slice(0,10).map(h=>'<div class="row"><span>'+esc(h.date)+' · '+esc(h.result.toUpperCase())+'</span><span class="muted">'+esc(h.hero.join(' '))+' · Pot '+h.pot+'</span></div>').join('')+'</div>':'<p class="muted">No hands played yet.</p>')}
function setName(){let n=$('#username').value.trim();if(!n){toast('Enter a display name');return}state.name=n.slice(0,24);save();render();toast('Profile saved')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pokerhub-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetData(){if(confirm('Delete all locally saved PokerHub progress?')){state={...base,completed:[],hands:[],achievements:[]};game=null;save();render();toast('Local progress reset')}}
render();
</script></body></html>
